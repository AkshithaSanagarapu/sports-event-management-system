<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Complaints</title>
    <!-- Link Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom CSS -->
    <style>
              
        .card {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="fixed-top">
        {% include 'nav/admin_nav.html' %}
    </div>
    <br>
    <br>
    <br>
    <br>
    <div class="container">
        <h2>Complaints</h2>
        <div class="row">
            {% for complaint in complaints %}
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Complaint by: {{ complaint.name }}</h5>
                        <p class="card-text"><strong>Branch:</strong> {{ complaint.branch }}</p>
                        <p class="card-text"><strong>Roll Number:</strong> {{ complaint.roll_number }}</p>
                        <p class="card-text"><strong>Complaint:</strong> {{ complaint.complaint }}</p>
                        <p class="card-text"><strong>Date:</strong> {{ complaint.datetime }}</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    <!-- Link Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>

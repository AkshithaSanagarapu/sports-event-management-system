<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Notification</title>
    <!-- Link Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="fixed-top">
        {% include 'nav/e_nav.html' %}
    </div>
    
    <br>
    <div class="container mt-5">
        <h2>Add Notification</h2>
        <form action="/add_notification" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="fileUpload">File Upload</label>
                <input type="file" class="form-control-file" id="fileUpload" name="file">
            </div>
            <div class="form-group">
                <label for="photoUpload">Photo Upload</label>
                <input type="file" class="form-control-file" id="photoUpload" name="photo">
            </div>
            <div class="form-group">
                <label for="notice">Notice</label>
                <textarea class="form-control" id="notice" name="notice" rows="3" placeholder="Enter notice"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

    <!-- Link Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>

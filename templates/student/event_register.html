<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>
    <!-- Link Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="fixed-top">
        {% include 'nav/s_nav.html' %}
    </div>
    <br>
    <div class="container mt-5">
        <h2 class="text-center">Event Registration</h2>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form action="/event_register" method="POST">
<input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="form-group">
                        <label for="event_name">Event Name:</label>
                        <select class="form-control" id="event_name" name="event_name" required>
                            <option value="" disabled selected>Select Event</option>
                            {% for event in events %}
                                <option value="{{ event.event_name }}">{{ event.event_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="user_name">Your Name:</label>
                        <input type="text" class="form-control" id="user_name" name="user_name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="contact_number">Contact Number:</label>
                        <input type="tel" class="form-control" id="contact_number" name="contact_number" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Register</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Link Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>

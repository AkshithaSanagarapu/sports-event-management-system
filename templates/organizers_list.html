<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizers List</title>
    <!-- Link Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <!-- Include admin navigation bar -->
    {% include 'nav/admin_nav.html' %}

    <div class="container mt-5">
        <h1>Organizers List</h1>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Address</th>
                    <th>Username</th>
                    <th>Password</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for organizer in organizers %}
                    <tr>
                        <td>{{ organizer.name }}</td>
                        <td>{{ organizer.email }}</td>
                        <td>{{ organizer.mobile }}</td>
                        <td>{{ organizer.address }}</td>
                        <td>{{ organizer.username }}</td>
                        <td>{{ organizer.password }}</td>
                        <td>
                            <form method="POST" action="{{ url_for('delete_organizer', organizer_id=organizer._id) }}">
<input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                            </form>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
